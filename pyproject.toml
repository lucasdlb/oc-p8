[project]
name = "oc-p8"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.14.1",
]

[dependency-groups]
api = [
    "credit-risk-data",
    "credit-risk-models",
    "credit-risk-processing",
    "evidently>=0.7.21",
    "fastapi>=0.136.3",
    "pandas>=3.0.3",
    "prometheus-client>=0.25.0",
    "uvicorn>=0.49.0",
]
dev = [
    "httpx>=0.28.1",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "onnxmltools>=1.14.0",
    "pre-commit>=4.6.0",
    "pyinstrument>=5.1.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "rich>=15.0.0",
    "ruff>=0.15.15",
    "ty>=0.0.40",
]

[tool.uv.sources]
credit-risk-data       = { git = "https://github.com/lucasdlb/oc-p6.git", tag = "credit-risk-data/v0.1.1",       subdirectory = "packages/credit-risk-data" }
credit-risk-models     = { git = "https://github.com/lucasdlb/oc-p6.git", tag = "credit-risk-models/v0.1.1",     subdirectory = "packages/credit-risk-models" }
credit-risk-processing = { git = "https://github.com/lucasdlb/oc-p6.git", tag = "credit-risk-processing/v0.1.1", subdirectory = "packages/credit-risk-processing" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_server"]

# ---------------------------------------
# pytest
# ---------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]

python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

addopts = """
--cov=src
--cov-report=term
--cov-report=xml
--cov-report=html
"""

# ---------------------------------------
# ruff
# ---------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "B", # bugbear
]

ignore = []

# ---------------------------------------
# ty
# ---------------------------------------
[tool.ty.src]
exclude = ["tests/", "scripts/"]

# ---------------------------------------
# coverage
# ---------------------------------------
[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/credit_risk_server/monitoring/benchmark.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
